name: CI

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Test with packaged time-zone data
        env:
          PYTHONTZPATH: ""
        run: python -m pytest -q
      - name: Smoke-test installed console script
        run: job-schedule-preview '*/15 9 * * 1-5' --zone UTC --after 2030-01-01T08:59Z --count 1 --format json
